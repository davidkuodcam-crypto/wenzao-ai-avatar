<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 針對行動裝置優化：禁止縮放，防止 iOS 點擊輸入框時自動放大畫面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 醫療助理 - AI AMAZE</title>
    <!-- 引入 Tailwind CSS 作為 UI 樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基礎防呆與隱藏滾動條 */
        body { margin: 0; overflow: hidden; background-color: #0f172a; touch-action: none; font-family: system-ui, -apple-system, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        
        /* UI 層次設定，使用 pointer-events 穿透機制讓滑鼠可以拖曳 3D 人物 */
        #ui-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 自訂動畫效果 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        .animate-fade-in-right { animation: slideInRight 0.5s ease-out forwards; opacity: 0; }
        .animate-pulse-glow { animation: pulseGlow 2s infinite; }
    </style>

    <!-- 設定 Three.js 與 Three-VRM 的 Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"
            }
        }
    </script>
</head>
<body>

    <!-- WebGL 渲染容器 (3D 人物) -->
    <div id="canvas-container"></div>

    <!-- 動態背景遮罩 (提升文字閱讀性) -->
    <div id="bg-overlay" class="absolute inset-0 transition-all duration-700 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent opacity-90 z-[5] pointer-events-none"></div>

    <!-- UI 主容器：限制最大寬度，使其在機台與手機上皆美觀 -->
    <div id="ui-wrapper" class="flex flex-col items-center justify-between">
        <div class="relative w-full max-w-[480px] h-full flex flex-col justify-between">
            
            <!-- ====== 頂部 Header ====== -->
            <div class="w-full p-6 flex justify-between items-start z-20 pointer-events-auto">
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 bg-white/20 backdrop-blur-md border border-white/30 rounded-full flex items-center justify-center text-white mb-1 shadow-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5L6 9H2v6h4l5 4V5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728"></path></svg>
                    </div>
                    <span class="font-bold text-white tracking-wider text-sm drop-shadow-md">AI AMAZE</span>
                </div>
                <div class="flex flex-col items-end">
                    <div class="bg-white/90 p-2 rounded-xl shadow-md">
                        <svg class="w-12 h-12 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    </div>
                    <span id="scan-hint" class="text-[10px] text-white mt-1 bg-black/40 backdrop-blur-sm px-2 py-0.5 rounded-full font-medium">友善醫療指引 官方LINE帳號</span>
                </div>
            </div>

            <!-- 系統狀態小燈號 (絕對定位於左側中央) -->
            <div class="absolute left-4 top-1/3 pointer-events-auto bg-black/20 backdrop-blur-sm p-2 rounded-full border border-white/10 hidden">
                <div id="status-light" class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)] transition-colors" title="API狀態"></div>
            </div>

            <!-- ====== 階段 1: 待機畫面 (Idle - 玻璃語言陣列) ====== -->
            <div id="idle-layer" class="absolute inset-x-0 bottom-0 flex flex-col justify-end pb-12 px-6 z-10 pointer-events-auto transition-opacity duration-500">
                <div class="mb-6 text-center animate-fade-in-up">
                    <h1 class="text-2xl font-bold text-white drop-shadow-lg mb-1 tracking-wide">您好，請選擇語言</h1>
                    <p class="text-white/80 text-sm drop-shadow-md">Please select your language to start</p>
                </div>

                <!-- 語言卡片網格 (2x2) -->
                <div class="grid grid-cols-2 gap-4" id="language-grid">
                    <!-- JS 動態生成 -->
                </div>
            </div>

            <!-- ====== 階段 2: 互動主介面 (Active) ====== -->
            <div id="active-layer" class="hidden absolute inset-x-0 bottom-0 flex flex-col justify-end pb-6 z-10">
                
                <!-- 對話泡泡與提示詞區 (靠右) -->
                <div class="flex flex-col items-end pr-6 pl-12 space-y-3 mb-6 pointer-events-auto">
                    <!-- AI 回覆泡泡 -->
                    <div id="chat-bubble" class="hidden bg-white/95 backdrop-blur-md px-5 py-3 rounded-2xl rounded-tr-sm shadow-xl border border-blue-100 text-gray-800 font-medium max-w-[90%] transform transition-all">
                        <p id="chat-text" class="text-lg text-blue-900 leading-relaxed"></p>
                    </div>

                    <!-- 建議問題區 -->
                    <div id="prompts-container" class="flex flex-col items-end space-y-3 w-full">
                        <!-- JS 動態生成 -->
                    </div>
                </div>

                <!-- 底部控制列 -->
                <div class="flex flex-col items-center px-4 relative w-full pointer-events-auto">
                    
                    <!-- 隱藏的文字輸入框 (融合於玻璃介面中) -->
                    <div class="flex gap-2 w-full mb-6 bg-white/20 backdrop-blur-md p-2 rounded-2xl border border-white/30 shadow-inner">
                        <input type="text" id="chat-input" placeholder="輸入文字..." class="flex-1 bg-white/60 text-blue-900 placeholder-blue-900/50 px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white/90 shadow-sm text-sm transition-all font-medium" />
                        <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-4 py-2.5 rounded-xl shadow transition-all duration-150 flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>

                    <!-- 語言快選選單 (浮動) -->
                    <div id="lang-menu" class="hidden absolute bottom-28 right-6 bg-white/95 backdrop-blur-xl p-2 rounded-2xl shadow-2xl border border-gray-100 flex-col gap-2 z-20">
                        <!-- JS 動態生成 -->
                    </div>

                    <!-- 核心操作按鈕列 -->
                    <div class="w-full flex justify-between items-center px-2">
                        <!-- 返回待機 (結束對話) -->
                        <button id="end-btn" class="flex items-center space-x-1 text-sm font-medium text-white bg-black/30 backdrop-blur-md px-4 py-3 rounded-full border border-white/20 hover:bg-black/50 transition-colors shadow-sm active:scale-95">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            <span id="end-btn-text">結束對話</span>
                        </button>

                        <!-- 大型麥克風按鈕 (置中突出) -->
                        <div class="relative group cursor-pointer active:scale-95 transition-transform -mt-10">
                            <div id="mic-halo" class="absolute -inset-3 bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-500 rounded-full blur-md opacity-0 transition-opacity duration-300"></div>
                            <button id="mic-btn" class="relative w-[80px] h-[80px] bg-white rounded-full flex items-center justify-center shadow-2xl border-4 border-slate-100 group-hover:border-blue-50 transition-colors">
                                <svg id="mic-icon" class="w-10 h-10 text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                            </button>
                            <!-- 麥克風提示文字 -->
                            <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 w-max text-center">
                                <span id="mic-hint" class="text-xs font-bold text-white bg-black/40 px-3 py-1 rounded-full backdrop-blur-sm shadow-sm border border-white/10">請點擊說話</span>
                            </div>
                        </div>

                        <!-- 語言切換按鈕 -->
                        <button id="toggle-lang-btn" class="flex items-center space-x-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-4 py-3 rounded-full shadow-lg border border-blue-500 hover:shadow-xl active:scale-95 transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                            <span id="current-lang-name" class="font-medium text-sm">中文</span>
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- UI 與 互動邏輯腳本 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // ==========================================
        // 1. 多國語言資料結構 (UI Data)
        // ==========================================
        const languages = [
            { id: 'zh', name: '繁體中文', icon: '🇹🇼', greeting: '開始對話', short: '中文' },
            { id: 'en', name: 'English', icon: '🇺🇸', greeting: 'Tap to Start', short: 'EN' },
            { id: 'vi', name: 'Tiếng Việt', icon: '🇻🇳', greeting: 'Chạm để bắt đầu', short: 'VN' },
            { id: 'id', name: 'Indonesia', icon: '🇮🇩', greeting: 'Mulai', short: 'ID' },
        ];

        const translations = {
            zh: {
                hello: '你好！我是您的專屬醫療助理',
                prompt1: '可以幫我介紹一下嗎？',
                prompt2: '你可以做些什麼？',
                prompt3: '醫院平面圖在哪裡？',
                micHintIdle: '請點擊說話',
                micHintListening: '聆聽中...',
                scanHint: '友善醫療指引 官方LINE帳號',
                endSession: '結束對話',
                inputPlaceholder: '輸入文字...'
            },
            en: {
                hello: 'Hello! I am your Medical Assistant',
                prompt1: 'Can you introduce yourself?',
                prompt2: 'What can you do?',
                prompt3: 'Where is the hospital map?',
                micHintIdle: 'Tap to speak',
                micHintListening: 'Listening...',
                scanHint: 'Official LINE Account',
                endSession: 'End Session',
                inputPlaceholder: 'Type a message...'
            },
            vi: {
                hello: 'Xin chào! Tôi là Trợ lý Y tế',
                prompt1: 'Giới thiệu về bạn?',
                prompt2: 'Bạn có thể làm gì?',
                prompt3: 'Bản đồ bệnh viện ở đâu?',
                micHintIdle: 'Chạm để nói',
                micHintListening: 'Đang nghe...',
                scanHint: 'LINE chính thức',
                endSession: 'Kết thúc',
                inputPlaceholder: 'Nhập tin nhắn...'
            },
            id: {
                hello: 'Halo! Saya Asisten Medis',
                prompt1: 'Bisa perkenalkan diri?',
                prompt2: 'Apa yang bisa Anda lakukan?',
                prompt3: 'Di mana peta rumah sakit?',
                micHintIdle: 'Ketuk untuk bicara',
                micHintListening: 'Mendengarkan...',
                scanHint: 'Akun LINE Resmi',
                endSession: 'Selesai',
                inputPlaceholder: 'Ketik pesan...'
            }
        };

        const langInstructions = {
            'zh': '請務必使用「繁體中文」回答。',
            'en': 'Please reply strictly in English.',
            'vi': 'Vui lòng trả lời bằng tiếng Việt.',
            'id': 'Harap jawab dalam bahasa Indonesia.'
        };

        // UI 狀態
        let currentStep = 'idle'; // 'idle' or 'active'
        let currentLang = 'zh';
        let showLangMenu = false;

        // ==========================================
        // 2. Three.js 與 模型變數
        // ==========================================
        let scene, camera, renderer, controls;
        let currentVrm = undefined;
        let particles;
        const clock = new THREE.Clock();

        let knowledgeBaseText = "";
        let baseSystemPromptText = "你是一個擁有 3D 虛擬身體的 AI 虛擬助教。你的名字叫做『美智』。當使用者詢問你的名字時，請務必回答『美智』。若使用者要求你做動作（如閉眼、張口等），請在文字回覆中自然地答應，並在 JSON 中設定對應動作。絕對不要說自己無法做動作或沒有身體！回答要簡短生動。";

        let expressionTimer = 0;
        let expressionBlend = 1;
        let currentExpression = 'neutral';
        let targetExpression = 'neutral';
        const expressions = ['happy', 'angry', 'sad', 'relaxed', 'surprised', 'neutral'];

        let activeSpecialAction = null;
        let specialActionTimer = 0;

        let isSpeaking = false;
        let lipSyncTimer = 0;
        let conversationHistory = [];

        // 語音全域狀態
        let autoRestartMic = false;
        let recognition = null;
        let isRecording = false;
        let silenceTimeout = null;

        // ==========================================
        // 3. UI 渲染與事件綁定 (DOM Management)
        // ==========================================
        function initUI() {
            renderLanguageGrid();
            renderLanguageMenu();
            
            // 綁定按鈕事件
            document.getElementById('end-btn').addEventListener('click', resetToIdle);
            document.getElementById('toggle-lang-btn').addEventListener('click', () => {
                showLangMenu = !showLangMenu;
                renderLanguageMenu();
            });
            document.getElementById('send-btn').addEventListener('click', handleSendManual);
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSendManual();
            });
            document.getElementById('chat-input').addEventListener('input', () => {
                if (document.getElementById('chat-input').value.trim() !== '') autoRestartMic = false;
            });
            
            // 點擊背景關閉語言選單
            document.getElementById('active-layer').addEventListener('click', (e) => {
                if(e.target.closest('#lang-menu') || e.target.closest('#toggle-lang-btn')) return;
                if(showLangMenu) {
                    showLangMenu = false;
                    renderLanguageMenu();
                }
            });
        }

        function renderLanguageGrid() {
            const grid = document.getElementById('language-grid');
            grid.innerHTML = '';
            languages.forEach((lang, idx) => {
                const btn = document.createElement('button');
                btn.className = `group relative overflow-hidden rounded-3xl bg-white/10 backdrop-blur-md border border-white/20 p-5 flex flex-col items-center justify-center shadow-2xl hover:bg-white/20 hover:border-white/40 hover:scale-[1.02] active:scale-95 transition-all duration-300`;
                btn.style.animationDelay = `${idx * 100}ms`;
                btn.innerHTML = `
                    <div class="absolute -inset-4 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-full blur-xl"></div>
                    <span class="text-4xl mb-2 filter drop-shadow-md">${lang.icon}</span>
                    <span class="font-bold text-white text-lg tracking-wide">${lang.name}</span>
                    <span class="text-xs text-white/70 mt-1 font-medium bg-black/20 px-3 py-1 rounded-full">${lang.greeting}</span>
                `;
                btn.onclick = () => startSession(lang.id);
                grid.appendChild(btn);
            });
        }

        function renderLanguageMenu() {
            const menu = document.getElementById('lang-menu');
            if (showLangMenu) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                menu.innerHTML = '';
                languages.forEach(lang => {
                    const btn = document.createElement('button');
                    const isActive = currentLang === lang.id;
                    btn.className = `flex items-center space-x-3 p-3 rounded-xl min-w-[120px] transition-colors ${isActive ? 'bg-blue-50 border border-blue-200' : 'hover:bg-gray-50'}`;
                    btn.innerHTML = `<span class="text-xl">${lang.icon}</span><span class="font-bold text-sm ${isActive ? 'text-blue-700' : 'text-gray-600'}">${lang.name}</span>`;
                    btn.onclick = () => {
                        currentLang = lang.id;
                        showLangMenu = false;
                        updateActiveUI(false); // 更新介面但不重播打招呼
                    };
                    menu.appendChild(btn);
                });
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        }

        function startSession(langId) {
            currentLang = langId;
            currentStep = 'active';
            
            // UI 切換動畫
            document.getElementById('idle-layer').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('bg-overlay').className = 'absolute inset-0 transition-all duration-700 bg-gradient-to-t from-white/30 via-white/10 to-transparent z-[5] pointer-events-none';
            
            setTimeout(() => {
                document.getElementById('idle-layer').classList.add('hidden');
                document.getElementById('active-layer').classList.remove('hidden');
                updateActiveUI(true); // 帶入打招呼
            }, 500);
        }

        function resetToIdle() {
            currentStep = 'idle';
            showLangMenu = false;
            
            window.speechSynthesis.cancel();
            if (isRecording && recognition) recognition.stop();
            autoRestartMic = false;
            conversationHistory = []; // 清空對話記憶

            document.getElementById('active-layer').classList.add('hidden');
            document.getElementById('idle-layer').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            document.getElementById('bg-overlay').className = 'absolute inset-0 transition-all duration-700 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent opacity-90 z-[5] pointer-events-none';
            document.getElementById('chat-bubble').classList.add('hidden');
            document.getElementById('chat-input').value = '';
            
            resetMicUI();
        }

        function updateActiveUI(playGreeting) {
            const t = translations[currentLang];
            const langData = languages.find(l => l.id === currentLang);

            // 更新文字標籤
            document.getElementById('scan-hint').textContent = t.scanHint;
            document.getElementById('end-btn-text').textContent = t.endSession;
            document.getElementById('current-lang-name').textContent = langData.short;
            document.getElementById('chat-input').placeholder = t.inputPlaceholder;
            
            if(!isRecording) {
                document.getElementById('mic-hint').textContent = t.micHintIdle;
            }

            // 更新提示詞按鈕
            const promptsContainer = document.getElementById('prompts-container');
            promptsContainer.innerHTML = '';
            [t.prompt1, t.prompt2, t.prompt3].forEach((promptText, idx) => {
                const btn = document.createElement('button');
                btn.className = `bg-white/95 backdrop-blur-md px-5 py-3 rounded-full shadow-lg border border-blue-100 text-blue-900 font-medium flex items-center space-x-2 hover:bg-blue-50 active:scale-95 transition-all transform animate-fade-in-right`;
                btn.style.animationDelay = `${(idx + 1) * 150}ms`;
                btn.innerHTML = `<svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg><span>${promptText}</span>`;
                btn.onclick = () => {
                    document.getElementById('chat-input').value = promptText;
                    handleSendManual();
                };
                promptsContainer.appendChild(btn);
            });

            // 處理打招呼
            if (playGreeting) {
                document.getElementById('chat-bubble').classList.remove('hidden');
                document.getElementById('chat-text').innerHTML = t.hello;
                conversationHistory.push({ role: "model", parts: [{ text: JSON.stringify({ reply: t.hello, expression: "happy", specialAction: "none", actionDuration: 3 }) }] });
                speakAndLipSync(t.hello);
            }
        }


        // ==========================================
        // 4. 設定檔載入與 Three.js 初始化
        // ==========================================
        async function loadConfig() {
            try {
                let promptUrl = './prompt.txt';
                let kbUrl = './knowledgebase.txt';
                
                if (window.location.protocol === 'blob:' || window.location.hostname.includes('usercontent.goog')) {
                    promptUrl = 'https://wenzao-ai-avatar.vercel.app/prompt.txt';
                    kbUrl = 'https://wenzao-ai-avatar.vercel.app/knowledgebase.txt';
                }

                const [promptRes, kbRes] = await Promise.all([
                    fetch(promptUrl).catch(() => null),
                    fetch(kbUrl).catch(() => null)
                ]);

                if (kbRes && kbRes.ok) {
                    knowledgeBaseText = await kbRes.text();
                }

                if (promptRes && promptRes.ok) {
                    const fullPromptText = await promptRes.text();
                    const parts = fullPromptText.split(/[=-]{3}\s*提示詞\s*[=-]{3}/);
                    if (parts.length > 1) {
                        baseSystemPromptText = "你的唯一名字是『美智』。請記住：『文藻AI虛擬助教』只是你的職稱。當被問及姓名時，請回答『美智』。" + parts[1].trim() + " (備註：你擁有3D虛擬身體，被要求做動作時請配合。)";
                    } else {
                        baseSystemPromptText = fullPromptText.trim();
                    }
                }
            } catch (error) {
                console.warn("載入設定檔失敗，將使用預設設定", error);
            }
        }

        async function init() {
            const container = document.getElementById('canvas-container');
            await loadConfig();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdbe3ea);
            scene.fog = new THREE.Fog(0xdbe3ea, 10, 50);

            // 根據螢幕比例調整 Camera 距離，確保人物在手機上不會太大
            const aspect = window.innerWidth / window.innerHeight;
            const camZ = aspect < 1 ? -2.0 : -1.6; // 手機版稍微退後

            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
            camera.position.set(0, 1.45, camZ); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.screenSpacePanning = true;
            controls.target.set(0, 1.3, 0); 
            // 限制旋轉角度，避免 UI 被穿模干擾
            controls.minPolarAngle = Math.PI / 3;
            controls.maxPolarAngle = Math.PI / 1.8;
            controls.enableZoom = false; 
            controls.update();

            setupEnvironment();
            window.addEventListener('resize', onWindowResize);

            let modelUrl = './AvatarSample_W.vrm';
            if (window.location.protocol === 'blob:' || window.location.hostname.includes('usercontent.goog')) {
                modelUrl = 'https://wenzao-ai-avatar.vercel.app/AvatarSample_W.vrm';
            }
            loadVRM(modelUrl);
            animate();
            initUI();
            setupVoice();
        }

        function setupEnvironment() {
            const ambientLight = new THREE.HemisphereLight(0xffffff, 0x999999, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xfff0dd, 2.0);
            directionalLight.position.set(2, 5, 3);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.bias = -0.001;
            scene.add(directionalLight);

            const fillLight = new THREE.DirectionalLight(0xcceeff, 1.2);
            fillLight.position.set(-2, 2, 2);
            scene.add(fillLight);
            
            // 移除原本網格地板，改成乾淨舞台，更符合玻璃質感 UI
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.8, metalness: 0.1 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 保留光環特效
            const ringGeometry = new THREE.RingGeometry(0.85, 0.9, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.01;
            scene.add(ring);
        }

        function loadVRM(url) {
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(
                url,
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    if (currentVrm) scene.remove(currentVrm.scene);
                    VRMUtils.removeUnnecessaryVertices(gltf.scene);
                    VRMUtils.removeUnnecessaryJoints(gltf.scene);

                    vrm.scene.traverse((obj) => {
                        obj.frustumCulled = false;
                        if (obj.isMesh) {
                            obj.castShadow = true;
                            obj.receiveShadow = true;
                        }
                    });

                    if (vrm.humanoid) {
                        const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
                        const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
                        if (leftUpperArm) leftUpperArm.rotation.z = -1.1; 
                        if (rightUpperArm) rightUpperArm.rotation.z = 1.1; 
                    }

                    vrm.scene.position.y = 0;
                    vrm.scene.rotation.y = Math.PI;
                    scene.add(vrm.scene);
                    currentVrm = vrm;
                    console.log('模型載入成功!');
                },
                undefined,
                (error) => { console.error('模型載入失敗:', error); }
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (currentVrm) {
                if (currentVrm.humanoid) {
                    const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
                    if (chest) chest.rotation.x = Math.sin(time * 1.5) * 0.015;
                }

                if (currentVrm.expressionManager) {
                    expressionTimer += delta;
                    if (expressionTimer > 4.0) {
                        expressionTimer = 0;
                        currentExpression = targetExpression;
                        targetExpression = expressions[Math.floor(Math.random() * expressions.length)];
                        expressionBlend = 0;
                    }
                    if (expressionBlend < 1.0) {
                        expressionBlend += delta * 2.0; 
                        if (expressionBlend > 1.0) expressionBlend = 1.0;
                    }

                    expressions.forEach(exp => currentVrm.expressionManager.setValue(exp, 0));

                    if (specialActionTimer > 0 && activeSpecialAction) {
                        specialActionTimer -= delta;
                        currentVrm.expressionManager.setValue(activeSpecialAction, 1.0);
                    } else if (activeSpecialAction) {
                        currentVrm.expressionManager.setValue(activeSpecialAction, 0);
                        activeSpecialAction = null;
                    }

                    if (isSpeaking) {
                        currentVrm.expressionManager.setValue('happy', 1.0);
                        lipSyncTimer += delta * 15;
                        const mouthOpenness = (Math.sin(lipSyncTimer) + 1) / 2; 
                        if (activeSpecialAction !== 'aa') {
                            currentVrm.expressionManager.setValue('aa', mouthOpenness * (Math.random() * 0.4 + 0.6));
                        }
                    } else {
                        currentVrm.expressionManager.setValue(currentExpression, 1.0 - expressionBlend);
                        currentVrm.expressionManager.setValue(targetExpression, expressionBlend);
                        if (activeSpecialAction !== 'aa') currentVrm.expressionManager.setValue('aa', 0);
                    }
                }
                currentVrm.update(delta);
            }

            if (particles) particles.rotation.y += delta * 0.05;
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;
            camera.position.z = aspect < 1 ? -2.0 : -1.6;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 5. Gemini API 串接與語音邏輯
        // ==========================================
        function setStatus(status) {
            const sl = document.getElementById('status-light');
            if (!sl) return;
            sl.parentElement.classList.remove('hidden');
            sl.className = 'w-3 h-3 rounded-full transition-colors ';
            if (status === 'connecting') sl.className += 'bg-blue-400 shadow-[0_0_8px_rgba(96,165,250,0.8)] animate-pulse';
            else if (status === 'success') sl.className += 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]';
            else if (status === 'error') sl.className += 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]';
            
            setTimeout(() => { sl.parentElement.classList.add('hidden'); }, 3000);
        }

        async function fetchWithBackoff(url, options, maxRetries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    if (response.status === 400 || response.status === 403 || response.status === 404) throw new Error(`API Error ${response.status}`);
                    if (i === maxRetries - 1) throw new Error(`Failed with ${response.status}`);
                } catch (error) {
                    if (error.message.includes('400') || error.message.includes('403') || error.message.includes('404')) throw error;
                    if (i === maxRetries - 1) throw error;
                }
                await new Promise(r => setTimeout(r, delays[i]));
            }
        }

        function handleSendManual() {
            const chatInput = document.getElementById('chat-input');
            window.speechSynthesis.cancel();
            isSpeaking = false;
            autoRestartMic = false;
            if(isRecording && recognition) recognition.stop();
            unlockAudioForIOS();
            
            const text = chatInput.value;
            if(text.trim() === '') return;
            sendMessage(text);
            chatInput.value = '';
        }

        async function sendMessage(text) {
            if (!text) return;

            const chatBubble = document.getElementById('chat-bubble');
            const chatText = document.getElementById('chat-text');
            
            chatBubble.classList.remove('hidden');
            chatText.innerHTML = `<span class="text-blue-600 text-sm opacity-80 border-b border-blue-100 pb-1 block mb-1">User: ${text}</span><span class="text-gray-500 text-sm animate-pulse">思考中 (Thinking)...</span>`;
            setStatus('connecting');
            conversationHistory.push({ role: "user", parts: [{ text: text }] });
            
            // 加入當前選擇語言的強制命令
            const langRule = langInstructions[currentLang] || langInstructions['zh'];
            const fullSystemInstruction = `${baseSystemPromptText}\n\n【重要：語言規定】\n${langRule}\n\n【回答資料來源優先順序】\n1. 優先使用下方的【知識庫內容】來回答。\n2. 若找不到答案，請使用 Google Search 搜尋網路。\n3. 若以上皆無明確資訊，請誠實回答「我不知道」。\n\n【重要指示】\n為了正確解析動作，請務必「只」回傳純 JSON 格式的文字。格式必須為：\n{\n  "reply": "你的回覆內容(必須符合規定的語言)",\n  "expression": "情緒(neutral, happy, angry, sad, relaxed, surprised)",\n  "specialAction": "動作(none, blink, blinkLeft, blinkRight, aa)",\n  "actionDuration": 3\n}\n\n【知識庫內容】\n${knowledgeBaseText}`;

            try {
                const response = await fetchWithBackoff(`/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: conversationHistory,
                        systemInstruction: { parts: [{ text: fullSystemInstruction }] },
                        tools: [{ googleSearch: {} }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                const aiText = data.candidates[0].content.parts[0].text;
                let replyText = aiText;
                
                const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                if (jsonMatch) {
                    try {
                        const aiResponse = JSON.parse(jsonMatch[0]);
                        replyText = aiResponse.reply || "（沒有回覆文字）";
                        if (expressions.includes(aiResponse.expression)) {
                            targetExpression = aiResponse.expression;
                            expressionBlend = 0;
                            expressionTimer = -10.0; 
                        }
                        if (aiResponse.specialAction && aiResponse.specialAction !== 'none') {
                            activeSpecialAction = aiResponse.specialAction;
                            specialActionTimer = aiResponse.actionDuration || 3;
                        }
                    } catch (e) {
                        replyText = aiText.replace(/\{"reply":/g, "").replace(/"expression":.*/g, "").replace(/[{}"]/g, "").trim();
                    }
                }

                setStatus('success');
                chatText.innerHTML = `${replyText}`;
                speakAndLipSync(replyText);
                conversationHistory.push({ role: "model", parts: [{ text: jsonMatch ? jsonMatch[0] : aiText }] });

            } catch (error) {
                console.error("發送失敗:", error);
                setStatus('error');
                chatText.innerHTML = `<span class="text-red-500 font-bold text-sm">連線失敗，請稍後再試。</span>`;
                conversationHistory.pop();
            }
        }

        // ==========================================
        // 6. 語音合成 (TTS) 與 語音辨識 (STT)
        // ==========================================
        window.keepAliveUtterances = [];
        let speechCheckInterval = null;

        function speakAndLipSync(text) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            if (speechCheckInterval) clearInterval(speechCheckInterval);
            if (window.speechSynthesis.resume) window.speechSynthesis.resume();

            const utterance = new SpeechSynthesisUtterance(text);
            window.keepAliveUtterances.push(utterance);
            
            // 根據選擇的語言設定發音
            const langMap = { 'zh': 'zh-TW', 'en': 'en-US', 'vi': 'vi-VN', 'id': 'id-ID' };
            utterance.lang = langMap[currentLang] || 'zh-TW';
            
            utterance.onstart = () => { isSpeaking = true; };
            utterance.onend = () => { 
                isSpeaking = false; 
                if (window.keepAliveUtterances.length > 20) window.keepAliveUtterances.length = 0;
                if (autoRestartMic && recognition && !isRecording) {
                    try { recognition.start(); } catch (e) {}
                }
            };
            utterance.onerror = () => { isSpeaking = false; };
            
            setTimeout(() => { window.speechSynthesis.speak(utterance); }, 50);

            let confirmStopCount = 0;
            speechCheckInterval = setInterval(() => {
                if (!window.speechSynthesis.speaking) {
                    confirmStopCount++;
                    if (confirmStopCount > 3) {
                        isSpeaking = false;
                        clearInterval(speechCheckInterval);
                    }
                } else {
                    confirmStopCount = 0;
                    isSpeaking = true;
                }
            }, 200);
        }

        function unlockAudioForIOS() {
            if (window.speechSynthesis.resume) window.speechSynthesis.resume();
            const silentUtterance = new SpeechSynthesisUtterance(' ');
            silentUtterance.volume = 0;
            window.speechSynthesis.speak(silentUtterance);
        }
        
        const initialUnlock = () => {
            unlockAudioForIOS();
            document.removeEventListener('touchstart', initialUnlock);
            document.removeEventListener('click', initialUnlock);
        };
        document.addEventListener('touchstart', initialUnlock, { once: true });
        document.addEventListener('click', initialUnlock, { once: true });

        function setupVoice() {
            const micBtn = document.getElementById('mic-btn');
            const micIcon = document.getElementById('mic-icon');
            const micHalo = document.getElementById('mic-halo');
            const micHint = document.getElementById('mic-hint');
            const chatInput = document.getElementById('chat-input');
            
            const isMobileOrTablet = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) && !isMobileOrTablet) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.interimResults = true;
                recognition.continuous = true;
                recognition.maxAlternatives = 1;

                recognition.onstart = function() {
                    isRecording = true;
                    // 更新 UI 為錄音狀態
                    micBtn.classList.remove('border-slate-100');
                    micBtn.classList.add('border-blue-400');
                    micIcon.classList.remove('text-blue-600');
                    micIcon.classList.add('text-pink-600');
                    micHalo.classList.remove('opacity-0');
                    micHalo.classList.add('opacity-60', 'animate-pulse-glow');
                    micHint.textContent = translations[currentLang].micHintListening;
                    micHint.classList.replace('bg-black/40', 'bg-pink-600/80');
                    resetSilenceTimeout();
                };

                recognition.onresult = function(event) {
                    let finalTranscript = '';
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                        else interimTranscript += event.results[i][0].transcript;
                    }
                    if (finalTranscript !== '') chatInput.value = finalTranscript;
                    else if (interimTranscript !== '') chatInput.value = interimTranscript;
                    resetSilenceTimeout();
                };

                recognition.onerror = function(event) {
                    if (event.error === 'not-allowed') {
                        alert('請允許麥克風權限才能使用語音輸入。');
                        autoRestartMic = false;
                    }
                };

                recognition.onend = function() {
                    isRecording = false;
                    clearTimeout(silenceTimeout);
                    resetMicUI();
                    
                    if (chatInput.value.trim() !== '') {
                        window.speechSynthesis.cancel();
                        isSpeaking = false;
                        unlockAudioForIOS();
                        sendMessage(chatInput.value);
                        chatInput.value = '';
                    } else if (autoRestartMic && !isSpeaking && currentStep === 'active') {
                        try { recognition.start(); } catch (e) {}
                    }
                };
            }

            function resetMicUI() {
                if(!micBtn) return;
                micBtn.classList.add('border-slate-100');
                micBtn.classList.remove('border-blue-400');
                micIcon.classList.add('text-blue-600');
                micIcon.classList.remove('text-pink-600');
                micHalo.classList.add('opacity-0');
                micHalo.classList.remove('opacity-60', 'animate-pulse-glow');
                if(currentStep === 'active') {
                    micHint.textContent = translations[currentLang].micHintIdle;
                    micHint.classList.replace('bg-pink-600/80', 'bg-black/40');
                }
            }

            function resetSilenceTimeout() {
                clearTimeout(silenceTimeout);
                if (isRecording) {
                    silenceTimeout = setTimeout(() => {
                        if (recognition && isRecording) recognition.stop();
                    }, 2000); 
                }
            }

            if (micBtn) {
                micBtn.addEventListener('click', () => {
                    if (!recognition) return;
                    if (isRecording) {
                        autoRestartMic = false;
                        recognition.stop();
                    } else {
                        autoRestartMic = true;
                        window.speechSynthesis.cancel();
                        isSpeaking = false;
                        unlockAudioForIOS();
                        // 根據當前選擇切換辨識語言
                        const sttLangMap = { 'zh': 'zh-TW', 'en': 'en-US', 'vi': 'vi-VN', 'id': 'id-ID' };
                        recognition.lang = sttLangMap[currentLang] || 'zh-TW';
                        try { recognition.start(); } catch (e) {}
                    }
                });
            }
        }

        // 啟動程式
        init();
    </script>
